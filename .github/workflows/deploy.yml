name: CI — FasoLocal

# Deployment itself is handled by Vercel's native GitHub integration:
#   develop → staging (Vercel Preview, aliased to fasolocal-staging.vercel.app)
#   master  → production (Vercel Production)
#
# This workflow only runs typecheck + lint + build on every push and PR so
# Vercel doesn't ship a broken build. Env vars are set in Vercel directly;
# the build below uses placeholder values just to satisfy the compiler.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  ci:
    name: Typecheck, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Build-time only. Runtime values come from Vercel env vars.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          NEXTAUTH_SECRET: ci-build-placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
