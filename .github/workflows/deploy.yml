name: CI/CD — FasoLocal

# Deployment is handled by Vercel's native GitHub integration:
#   develop → Vercel preview URL (staging Supabase creds set in Vercel dashboard)
#   master  → Vercel production URL (prod Supabase creds set in Vercel dashboard)
#
# This workflow only runs build + lint checks to catch errors before Vercel deploys.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

defaults:
  run:
    working-directory: ./FasoLocalUpdate

jobs:
  # ─── Staging: Build & Lint (develop branch + PRs targeting develop) ─────────
  build-staging:
    name: Build & Lint (Staging)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FasoLocalUpdate/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build (staging mode)
        run: npm run build:staging
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL_STAGING }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_STAGING }}

  # ─── Production: Build & Lint (master branch + PRs targeting master) ────────
  build-prod:
    name: Build & Lint (Production)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FasoLocalUpdate/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build (production mode)
        run: npm run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
